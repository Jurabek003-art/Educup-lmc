<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>EduCenter LMS</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">E</span><div><strong>EduCenter</strong><small>LMS Mini App</small></div></div>
      <nav id="desktopNav" class="nav"></nav>
      <div class="sidebar-footer">
        <button id="themeBtn" class="ghost-btn">☾ Rejim</button>
        <div class="profile-mini"><div class="avatar">JM</div><div><strong>Admin</strong><small>Super Admin</small></div></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><small class="eyebrow">O‘QUV MARKAZI</small><h1 id="pageTitle">Dashboard</h1></div>
        <div class="top-actions">
          <button id="searchBtn" class="icon-btn" aria-label="Qidiruv">⌕</button>
          <button id="notificationBtn" class="icon-btn" aria-label="Bildirishnomalar">♢<span class="dot"></span></button>
          <div class="avatar">JM</div>
        </div>
      </header>
      <section id="app" class="content"></section>
    </main>

    <nav id="mobileNav" class="mobile-nav"></nav>
  </div>

  <dialog id="searchDialog" class="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-head"><h3>Global qidiruv</h3><button class="icon-btn">×</button></div>
      <input id="globalSearch" class="input" placeholder="Talaba, guruh, o‘qituvchi..." autofocus />
      <div id="searchResults" class="search-results"></div>
    </form>
  </dialog>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
